[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtod"
version = "0.0.1"
description = "Quantize and prune YOLOX-Tiny, then benchmark it honestly against the original."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jian Lee", email = "leejianrong2@gmail.com" }]
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.9"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18", "onnx>=1.16"]
torch = ["torch>=2.4", "onnx>=1.16"]
coco = ["pycocotools>=2.0.8"]
plot = ["matplotlib>=3.8", "tensorboard>=2.16"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7", "matplotlib>=3.8"]

[project.scripts]
rtod = "rtod.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rtod"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/rtod/_yolox"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
exclude = ["src/rtod/_yolox"]

[[tool.mypy.overrides]]
module = ["torch.*", "onnx.*", "onnxruntime.*", "cv2.*", "pycocotools.*", "matplotlib.*", "tensorboard.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rtod.models"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs onnxruntime and small model artifacts, CPU only",
  "slow: full-dataset accuracy runs, run manually or on RunPod",
  "gpu: needs a CUDA GPU, skipped elsewhere",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# torch.nn module surgery (setattr on children, ModuleList item assignment) is not expressible in
# torch's stubs; the integration tests cover this module instead.
[[tool.mypy.overrides]]
module = ["rtod.qat", "rtod.train"]
ignore_errors = true
