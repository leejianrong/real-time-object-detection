[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtod"
version = "0.0.1"
description = "Quantize and prune YOLOX-Tiny, then benchmark it honestly against the original."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jian Lee", email = "leejianrong2@gmail.com" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18", "onnx>=1.16"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/rtod"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs onnxruntime and small model artifacts, CPU only",
  "slow: full-dataset accuracy runs, run manually or on RunPod",
  "gpu: needs a CUDA GPU, skipped elsewhere",
]
