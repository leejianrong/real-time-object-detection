name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: make install
      - run: make lint
      - run: make typecheck
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: make install
      - run: make unit
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: make install
      - run: make integration
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: astral-sh/setup-uv@v5
      - run: make install
      - run: make audit
  notebook:
    # Executes the showcase notebook end to end (downloads the published models). Slow, so it runs
    # only when the notebook or what it imports changes, and on main.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(join(github.event.pull_request.labels.*.name, ','), 'notebook')
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: make install
      - run: uv run pytest tests/notebook -m notebook -q
